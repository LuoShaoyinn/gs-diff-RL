[project]
name = "gs-diff-rl"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["torch", "genesis-world==1.4.5", "gymnasium[mujoco]>=1.2,<2"]

[project.optional-dependencies]
cuda = ["torch", "triton"]
rocm = ["torch", "triton"]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [{ index = "rocm724", extra = "rocm" }, { index = "cuda130", extra = "cuda" }]
triton = [{ index = "rocm724", extra = "rocm" }, { index = "cuda130", extra = "cuda" }]

[[tool.uv.index]]
name = "cuda130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "rocm724"
url = "https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.4/"
format = "flat"
explicit = true
